# ===============================================================
#  hyprland.conf — Nullforge
#  drop into ~/.config/omarchy/themes/nullforge/hyprland.conf
#  (Omarchy sources this on top of the user's main hyprland.conf)
# ===============================================================

general {
    # Forge-orange active border, faded Null inactive
    col.active_border   = rgb(c4622d) rgb(e8a882) 45deg
    col.inactive_border = rgba(1a2a3a88)

    gaps_in  = 4
    gaps_out = 8
    border_size = 2
}

decoration {
    rounding = 2          # mono is angular — keep windows sharp

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = false
    }

    # Hard offset shadow — matches the brand
    shadow {
        enabled = true
        range = 16
        render_power = 2
        color = rgba(0a1420aa)
        color_inactive = rgba(0a142066)
        offset = 0 2
    }

    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0
}

# Group / tab bar (when stacking windows)
group {
    col.border_active   = rgb(c4622d)
    col.border_inactive = rgba(1a2a3a88)
    col.border_locked_active   = rgb(8f4420)
    col.border_locked_inactive = rgba(0a1420cc)

    groupbar {
        col.active = rgb(c4622d)
        col.inactive = rgba(1a2a3acc)
        text_color = rgb(f2ece6)
    }
}

# Minimal animation curves — fast & mechanical, no bounce.
animations {
    enabled = true
    bezier  = forge, 0.2, 0, 0, 1
    animation = windows,     1, 2, forge
    animation = windowsOut,  1, 2, forge, popin 92%
    animation = border,      1, 4, forge
    animation = borderangle, 1, 6, forge
    animation = fade,        1, 2, forge
    animation = workspaces,  1, 3, forge
}

misc {
    background_color = rgb(0a1420)
}
