# ===============================================================
#  hyprlock.conf — Nullforge
#  https://github.com/sailfact/nullforge-omarchy-theme
#    ============================================================= */

general {
    disable_loading_bar = false
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
    no_fade_out         = false
    ignore_empty_input  = true
    # Immediate re-lock after wake
    immediate_render    = true
}

# ── Background ────────────────────────────────────────────────────────────────

background {
    monitor  =
    # Swap path for your actual wallpaper if desired; the void gradient is the
    # canonical Nullforge lockscreen surface.
    path     = ~/.config/hypr/wallpapers/nullforge-void-16x9.png

    # Fallback colour when path is missing — void
    color    = rgb(0a1420)

    # Subtle darkening blur — keeps the forge text crisp over the wallpaper
    blur_size        = 4
    blur_passes      = 2
    noise            = 0.012
    contrast         = 1.05
    brightness       = 0.80
    vibrancy         = 0.0
    vibrancy_darkness = 0.0
}

# ── Clock — display type, top-centre ─────────────────────────────────────────

label {
    monitor  =
    text     = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color    = rgba(f2ece6ff)           # parchment
    font_size   = 80
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0a142066)

    position = 0, 180
    halign   = center
    valign   = top
}

# Date sub-label — micro style
label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color    = rgba(7a9bb8cc)           # slate, slightly transparent
    font_size   = 13
    font_family = JetBrains Mono Medium
    letter_spacing = 2

    position = 0, 278
    halign   = center
    valign   = top
}

# ── Password input ────────────────────────────────────────────────────────────

input-field {
    monitor  =

    size     = 340, 46

    # null surface with forge accent border
    outer_color  = rgb(c4622d)          # forge — accent ring
    inner_color  = rgb(06101a)          # bg-code — deepest input well
    font_color   = rgb(f2ece6)          # parchment

    # Dot style — small forge-coloured bullets
    check_color  = rgb(8fb27e)          # success green when unlocking
    fail_color   = rgb(d97264)          # danger red on wrong entry
    fail_transition = 200

    font_family  = JetBrains Mono
    font_size    = 14

    placeholder_text = <span foreground="##7a9bb8">// passphrase</span>

    dots_size       = 0.28
    dots_spacing    = 0.16
    dots_center     = true
    dots_rounding   = -1               # circle dots

    # Rounding — radius-1 (2 px) from design system; hyprlock uses rounding in px
    rounding        = 2

    # Fade outline back to depth when idle
    capslock_color  = rgb(c4622d)       # forge — warn user caps is on
    numlock_color   = -1

    shadow_passes   = 2
    shadow_size     = 6
    shadow_color    = rgba(0a142055)

    position = 0, -60
    halign   = center
    valign   = center
}

# ── Prompt label — above input ────────────────────────────────────────────────

label {
    monitor  =
    text     = <b>$</b> authenticate
    color    = rgba(c4622dcc)           # forge, semi-transparent
    font_size   = 11
    font_family = JetBrains Mono Bold
    letter_spacing = 2

    position = 0, -12
    halign   = center
    valign   = center
}

# ── Fail message ──────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = $FAIL <b>($ATTEMPTS)</b>
    color    = rgba(d97264dd)           # danger red
    font_size   = 11
    font_family = JetBrains Mono Medium

    position = 0, -114
    halign   = center
    valign   = center
}

# ── System info strip — bottom-left (optional) ────────────────────────────────

label {
    monitor  =
    text     = cmd[update:5000] echo "  $(uname -n)  ·  $(date +'%Z')"
    color    = rgba(3d5a7599)           # depth, muted
    font_size   = 10
    font_family = JetBrains Mono
    letter_spacing = 1

    position = 22, -22
    halign   = left
    valign   = bottom
}

# ── Caps-lock indicator ───────────────────────────────────────────────────────

label {
    monitor  =
    text     = [caps]
    color    = rgba(c4622dff)           # forge — accent warning
    font_size   = 10
    font_family = JetBrains Mono Bold
    letter_spacing = 1

    # Only rendered by hyprlock when caps is on; position bottom-right
    position = -22, -22
    halign   = right
    valign   = bottom
}