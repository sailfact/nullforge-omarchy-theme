#  hyprlock.conf — Nullforge
#  https://github.com/sailfact/nullforge-omarchy-theme

$color = rgba(10, 20, 32, 1)        # background / void
$inner_color = rgba(6, 16, 26, 1)   # bg-code — deepest input well
$outer_color = rgba(196, 98, 45, 1) # forge — accent border
$font_color = rgba(242, 236, 230, 1) # foreground / parchment
$placeholder_color = rgba(122, 155, 184, 1) # slate / accent
$check_color = rgba(143, 178, 126, 1) # success green / color2

general {
    disable_loading_bar = false
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
    no_fade_out         = false
    ignore_empty_input  = true
    # Immediate re-lock after wake
    immediate_render    = true
}

# Background

background {
    monitor  = 
    # Swap path for your actual wallpaper if desired; the void gradient is the
    # canonical Nullforge lockscreen surface.
    path     = ~/.config/hypr/wallpapers/nullforge-void-16x9.png

    # Fallback colour when path is missing — void
    color    = rgb(0a1420)

    # Subtle darkening blur — keeps the forge text crisp over the wallpaper
    blur_size        = 4
    blur_passes      = 2
    noise            = 0.012
    contrast         = 1.05
    brightness       = 0.80
    vibrancy         = 0.0
    vibrancy_darkness = 0.0
}

# Clock — display type, top-centre

label {
    monitor  = 
    text     = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color    = rgba(f2ece6ff)           # parchment
    font_size   = 80
    font_family = JetBrains Mono ExtraBold

    position = 0, 180
    halign   = center
    valign   = top
}

# Date sub-label — micro style
label {
    monitor  = 
    text     = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color    = rgba(7a9bb8cc)           # slate, slightly transparent
    font_size   = 13
    font_family = JetBrains Mono Medium
    letter_spacing = 2

    position = 0, 278
    halign   = center
    valign   = top
}
# System info strip — bottom-left (optional) 

label {
    monitor  = 
    text     = cmd[update:5000] echo "  $(uname -n)  ·  $(date +'%Z')"
    color    = rgba(3d5a7599)           # depth, muted
    font_size   = 10
    font_family = JetBrains Mono
    letter_spacing = 1

    position = 22, -22
    halign   = left
    valign   = bottom
}

# Caps-lock indicator

label {
    monitor  = 
    text     = [caps]
    color    = rgba(c4622dff)           # forge — accent warning
    font_size   = 10
    font_family = JetBrains Mono Bold
    letter_spacing = 1

    # Only rendered by hyprlock when caps is on; position bottom-right
    position = -22, -22
    halign   = right
    valign   = bottom
}