# ===============================================================
#  hyprlock.conf — Nullforge
#  drop into ~/.config/omarchy/themes/nullforge/hyprlock.conf
# ===============================================================

general {
    grace = 2
    hide_cursor = true
}

background {
    monitor =
    # symlinked by omarchy from backgrounds/
    path = $HOME/.config/omarchy/current/background
    blur_passes = 3
    blur_size = 6
    contrast = 0.92
    brightness = 0.82
    vibrancy = 0.18
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(f2ece6ff)
    font_size = 128
    font_family = JetBrains Mono ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "// $(date +'%A · %d %b %Y')"
    color = rgba(7a9bb8ff)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -56
    halign = center
    valign = center
}

# brand tag
label {
    monitor =
    text = nullforge — build from nothing.
    color = rgba(c4622dff)
    font_size = 13
    font_family = JetBrains Mono Medium
    position = 0, 48
    halign = center
    valign = bottom
}

# password prompt
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.6
    dots_center = true
    outer_color = rgba(c4622dff)
    inner_color = rgba(0a1420dd)
    font_color = rgba(f2ece6ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##7a9bb8">$ enter password_</span>
    hide_input = false
    rounding = 2
    check_color = rgba(8fb27eff)
    fail_color = rgba(d97264ff)
    fail_text = panic: $FAIL ($ATTEMPTS)
    position = 0, -160
    halign = center
    valign = center
}
