# ===============================================================
#  mako.ini — Nullforge (notification daemon)
#  drop into ~/.config/omarchy/themes/nullforge/mako.ini
# ===============================================================

font=JetBrains Mono Medium 11
background-color=#0a1420
text-color=#f2ece6
border-color=#c4622d
border-size=1
border-radius=2
padding=12
margin=8
default-timeout=5000
icons=1
max-icon-size=32
progress-color=over #c4622d

[urgency=low]
border-color=#3d5a75
text-color=#7a9bb8

[urgency=normal]
border-color=#c4622d

[urgency=critical]
border-color=#d97264
default-timeout=0

[category=forge]
border-color=#c4622d
